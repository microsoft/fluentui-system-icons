nodeLinker: node-modules

npmRegistryServer: 'https://registry.npmjs.org'

# Yarn quarantines versions published more recently than `npmMinimalAgeGate`
# (default 3d) as a supply-chain mitigation, failing installs with YN0016.
# First-party Fluent UI packages are exempt so we can consume them the day they
# ship; keep the gate on for everything else.
npmPreapprovedPackages:
  - '@fluentui/*'

# Single source of truth for tools a workspace has to run in a tight loop, where
# `yarn run -T` startup overhead would dominate. See docs/single-version-policy.md.
catalog:
  avocado: 1.0.0
