# Simple workflow for deploying static content to GitHub Pages
name: Deploy docsite

on:
  # Allow manual trigger only for now
  # push:
  #   branches: [main]
  #   paths:
  #     - 'packages/docsite/**'
  #     - 'packages/react-icons/**'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

env:
  NX_PARALLEL: 4
  NX_VERBOSE_LOGGING: true

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    # Only deploy from the main branch of the microsoft org repo to prevent
    # accidental deployments from forks or feature branches.
    if: github.repository_owner == 'microsoft' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - run: corepack enable

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: 'yarn'

      - run: yarn install --immutable
      - run: yarn playwright install --with-deps

      - name: Build docsite
        run: |
          yarn nx run docsite:build
          yarn nx run docsite:extract-storybook-llms

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: packages/docsite/storybook-static
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
