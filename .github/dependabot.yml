version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      github-actions:
        patterns:
          - '*'
      # Grouped security fixes, produced on the same weekly cadence as version updates.
      github-actions-security:
        applies-to: security-updates
        patterns:
          - '*'

  - package-ecosystem: 'npm'
    # Single yarn workspace root: yarn.lock at `/` covers every workspace package.
    directory: '/'
    schedule:
      interval: 'weekly'
    # Only minor/patch version bumps — skip majors to avoid churn and breaking changes.
    # (Does not affect security updates, which must be able to jump majors.)
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      # Nx is upgraded exclusively via `yarn nx migrate`, which keeps the whole `nx`/`@nx/*` set
      # version-locked and applies config codemods (nx.json, project.json, migrations.json).
      # A Dependabot bump only touches package.json/yarn.lock, so it silently skips the codemods
      # and can desync plugin versions from the Nx runtime. Banned outright, security updates
      # included — those must go through `nx migrate` too.
      - dependency-name: 'nx'
      - dependency-name: '@nx/*'
      - dependency-name: '@nrwl/*'
    groups:
      production-dependencies:
        dependency-type: 'production'
        patterns:
          - '*'
      development-dependencies:
        dependency-type: 'development'
        patterns:
          - '*'
      # Grouped security fixes, produced on the same weekly cadence as version updates.
      security-dependencies:
        applies-to: security-updates
        patterns:
          - '*'
