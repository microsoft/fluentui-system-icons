version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      github-actions:
        patterns:
          - '*'
      # Grouped security fixes, produced on the same weekly cadence as version updates.
      github-actions-security:
        applies-to: security-updates
        patterns:
          - '*'
    cooldown:
      default-days: 7

  - package-ecosystem: 'npm'
    # Single yarn workspace root: yarn.lock at `/` covers every workspace package.
    directory: '/'
    # packages/react-icons pins its own TypeScript version (see the dedicated entry below)
    # and must not be touched by this grouped update, so its manifest is handled separately.
    exclude-paths:
      - 'packages/react-icons/**'
    schedule:
      interval: 'weekly'
    # Only minor/patch version bumps — skip majors to avoid churn and breaking changes.
    # (Does not affect security updates, which must be able to jump majors.)
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      # Nx is upgraded exclusively via `yarn nx migrate`, which keeps the whole `nx`/`@nx/*` set
      # version-locked and applies config codemods (nx.json, project.json, migrations.json).
      # A Dependabot bump only touches package.json/yarn.lock, so it silently skips the codemods
      # and can desync plugin versions from the Nx runtime. Banned outright, security updates
      # included — those must go through `nx migrate` too.
      - dependency-name: 'nx'
      - dependency-name: '@nx/*'
      - dependency-name: '@nrwl/*'
    groups:
      production-dependencies:
        dependency-type: 'production'
        patterns:
          - '*'
      development-dependencies:
        dependency-type: 'development'
        patterns:
          - '*'
      # Grouped security fixes, produced on the same weekly cadence as version updates.
      security-dependencies:
        applies-to: security-updates
        patterns:
          - '*'

  - package-ecosystem: 'npm'
    # packages/react-icons intentionally pins `typescript` to 4.1.6 (see package.json), which
    # is independent of the repo-wide toolchain version. This dedicated entry keeps every other
    # dependency in this workspace up to date without letting the grouped root update above
    # (which excludes this path) bump `typescript` here.
    directory: 'packages/react-icons'
    schedule:
      interval: 'weekly'
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'nx'
      - dependency-name: '@nx/*'
      - dependency-name: '@nrwl/*'
      # Must stay on 4.1.6 — see the language/TS version constraints called out in
      # packages/react-icons/package.json. Security updates are intentionally included here too.
      - dependency-name: 'typescript'
    groups:
      production-dependencies:
        dependency-type: 'production'
        patterns:
          - '*'
      development-dependencies:
        dependency-type: 'development'
        patterns:
          - '*'
      security-dependencies:
        applies-to: security-updates
        patterns:
          - '*'
