apply plugin: 'maven-publish'
apply plugin: 'signing'

task androidSourcesJar(type: Jar) {
    archiveClassifier.set('sources')
    from android.sourceSets.main.java.srcDirs
    from android.sourceSets.main.res.srcDirs
    from android.sourceSets.main.manifest.srcFile
}

task androidJavadocsJar(type: Jar) {
    archiveClassifier.set('javadoc')
}

artifacts {
    archives androidSourcesJar
    archives androidJavadocsJar
}

group = project.POM_GROUP_ID
version = getReleaseVersion()

afterEvaluate {
    publishing {
        /*----- Adding local maven repo to generate artifact -----*/
        repositories {
            maven {
                name = "local"
                url "$buildDir/artifacts"
            }
        }
        publications {
            release(MavenPublication) {
                groupId project.POM_GROUP_ID
                artifactId project.POM_ARTIFACT_ID
                version getReleaseVersion()

                artifact("$buildDir/outputs/aar/${project.getName()}-release.aar")
                artifact androidSourcesJar
                artifact androidJavadocsJar

                pom {
                    packaging = 'aar'
                    name = project.POM_ARTIFACT_ID
                    description = 'Fluent System Icons are a collection of familiar, friendly and modern icons from Microsoft.'
                    url = 'https://github.com/microsoft/fluentui-system-icons'
                    licenses {
                        license {
                            name = 'MIT License'
                            url = 'https://github.com/microsoft/fluentui-system-icons/blob/main/LICENSE'
                        }
                    }
                    developers {
                        developer {
                            id = 'fluent-ui-android'
                            name = 'Microsoft Inc.'
                            email = 'fluentuinativeowners@microsoft.com'
                        }
                    }
                    scm {
                        connection = 'scm:git:github.com/microsoft/fluentui-system-icons.git'
                        developerConnection = 'scm:git:ssh://github.com/microsoft/fluentui-system-icons.git'
                        url = 'https://github.com/microsoft/fluentui-system-icons/tree/main'
                    }
                    withXml {
                        def dependenciesNode = asNode().appendNode('dependencies')

                        project.configurations.implementation.allDependencies.each {
                            def dependencyNode = dependenciesNode.appendNode('dependency')
                            dependencyNode.appendNode('groupId', it.group)
                            dependencyNode.appendNode('artifactId', it.name)
                            dependencyNode.appendNode('version', it.version)
                        }
                    }
                }
            }
        }
    }

    tasks.named('publishReleasePublicationToLocalRepository') {
        dependsOn 'assembleRelease', androidSourcesJar, androidJavadocsJar
    }
    tasks.named('signReleasePublication') {
        dependsOn 'bundleReleaseAar'
    }
}

def signingKey = System.getenv('GPG_SIGNING_KEY')
def signingPassword = System.getenv('GPG_SIGNING_PASSWORD') ?:
    project.findProperty('GPGSigningPassword')
def signingKeyId = project.findProperty('GPGSigningKeyID')
def signingKeyRingFile = project.findProperty('SigningSecretKeyRingFile') ?:
    System.getenv('SIGNING_SECRET_KEY_RING_FILE')

if (signingKeyId) {
    ext["signing.keyId"] = signingKeyId
}
if (signingPassword) {
    ext["signing.password"] = signingPassword
}
if (signingKeyRingFile) {
    ext["signing.secretKeyRingFile"] = signingKeyRingFile
}

signing {
    required {
        signingKey || signingKeyRingFile
    }
    if (signingKey) {
        useInMemoryPgpKeys(signingKey, signingPassword)
    }
    sign publishing.publications
}

String getReleaseVersion() {
    String version = System.getenv('VERSION_NAME') ?:
        project.findProperty('VERSION_NAME') ?:
        project.findProperty('versionName')

    if (version) {
        return version
    }

    return project.VERSION_NAME + "-SNAPSHOT"
}
